{% assign share_url = site.url | append: page.url | uri_escape %}
{% assign share_title = page.title | uri_escape %}
<div class="share-page">
  <p class="share-text">Share this on &rarr;</p>
  <a
    class="share-btn share-linkedin"
    href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}"
    target="_blank"
    rel="noopener noreferrer"
    ><i class="fab fa-linkedin fa-fw"></i> LinkedIn</a
  >
  <a
    class="share-btn share-whatsapp"
    href="https://wa.me/?text={{ share_title }}%20{{ share_url }}"
    target="_blank"
    rel="noopener noreferrer"
    ><i class="fab fa-whatsapp fa-fw"></i> WhatsApp</a
  >
</div>
