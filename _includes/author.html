<div class="card author-card">
    <div class="author-card-inner">
        {% if author.avatar_url %}
        <img class="author-profile-img" src="/assets/img/authors/{{author.avatar_url}}" alt="{{author.name}}" />
        {% else %}
        <img class="author-profile-img" src="{{site.url}}/assets/img/authors/{{author.avatar}}" alt="{{author.name}}" />
        {% endif %}
        <div class="author-card-text">
            <p class="author-card-label">Written by</p>
            <h3 class="author-card-name">{{author.name}}</h3>
            <p class="author_bio">{{author.bio}}</p>
            <ul class="author-card-contact">
                <li><i class="fas fa-envelope fa-fw"></i><a href="mailto:{{author.email}}">{{author.email}}</a></li>
                <li><i class="fas fa-globe fa-fw"></i><a href="{{author.site}}" target="_blank" rel="noopener">{{author.site | remove: "https://" | remove: "http://"}}</a></li>
            </ul>
            <p class="profile-links">
                {% for network in author.social %}
                    <a class="social-link" href="{{ network.url }}" target="_blank" rel="noopener"><i class="fab fa-{{ network.title }} fa-fw"></i></a>
                {% endfor %}
            </p>
        </div>
    </div>
</div>
